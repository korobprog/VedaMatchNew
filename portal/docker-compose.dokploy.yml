services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - motivation-redis:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        MOTIVATION_BUILD_VERSION: 6d91528
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # Запуск идёт через ENTRYPOINT образа (apps/api/docker-entrypoint.sh):
    # migrate deploy → db seed (SEED_ON_START=0 отключает) → node dist/main.js.
    # DATABASE_URL задаётся в Dokploy целиком, с реальным хостом Postgres
    # (например postgresql://user:pass@vedamatch-portal-db-scqe9y:5432/vedamatch);
    # никаких sed-подмен хоста в command больше нет.
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT}
      WEB_ORIGIN: ${WEB_ORIGIN}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Способы входа помимо Google. Со значением по умолчанию: способ может
      # быть выключен в AuthProviderSetting, и тогда ключей нет вовсе — без
      # `:-` docker compose ругался бы на каждом подъёме без них.
      #
      # Переменную мало положить в .env: в процесс попадает только то, что
      # перечислено здесь. Иначе requireYandex() не видит ключей и отдаёт 503
      # «не сконфигурирован» при заполненной панели — искать такое долго.
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      # Бот @vedamatch_bot: ключ проверки подписи и мини-приложения
      # (POST /auth/telegram/webapp), и виджета входа на самом сайте
      # (GET /auth/telegram/callback, apps/api/src/modules/auth/
      # telegram-login-widget.ts) — секреты у них разные, но токен один.
      # Пусто — оба способа отвечают 503.
      #
      # Виджет на сайте (data-auth-url) требует ОДНОКРАТНОЙ настройки в
      # BotFather: /setdomain → vedamatch.com. Домен у бота ровно один —
      # мини-приложение (TELEGRAM_WEBAPP_URL ниже) этой настройки не требует.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Веха 4, «Уведомления через Telegram-бота» (TelegramSenderService):
      # адрес Bot API и адрес мини-приложения для кнопки «Открыть» в
      # сообщении бота. Дефолты совпадают со значениями в коде — переменные
      # нужны только для переопределения (свой прокси к Bot API, другой домен).
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_WEBAPP_URL: ${TELEGRAM_WEBAPP_URL:-https://ios.vedamatch.com}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL не задан в окружении Dokploy}
      # Российский контур. Персональные данные тех, у кого dataResidency = ru,
      # пишутся сначала в московскую базу, копия — в амстердамскую.
      #
      # Два условия, а не одно: строка подключения может быть заведена заранее,
      # а решение о том, куда едут персональные данные, обязано быть отдельным.
      # Включать только после уведомления Роскомнадзора о трансграничной
      # передаче — оно подаётся ДО первой передачи.
      RU_DATABASE_URL: ${RU_DATABASE_URL:-}
      RU_CONTOUR_ENABLED: ${RU_CONTOUR_ENABLED:-false}
      SEED_ON_START: ${SEED_ON_START:-1}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # Раздача APK с сайта: отсюда воркер выпусков (notifications/
      # app-release-worker.service.ts) раз в минуту читает
      # mobile/android/ru-site/latest.json — новая версия уходит постом в
      # канал VedaMatch и пушем «обновите» отставшим телефонам. По умолчанию
      # тот же S3_PUBLIC_URL, что у web (APP_DOWNLOAD_BASE_URL ниже).
      APP_DOWNLOAD_BASE_URL: ${APP_DOWNLOAD_BASE_URL:-${S3_PUBLIC_URL:-}}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MOTIVATION_AI_BASE_URL: ${MOTIVATION_AI_BASE_URL:-${NEUROGATE_BASE_URL:-https://r-api.vibemod.pro/v1}}
      MOTIVATION_AI_API_KEY: ${MOTIVATION_AI_API_KEY:-${NEUROGATE_API_KEY}}
      MOTIVATION_TEXT_MODEL: ${MOTIVATION_TEXT_MODEL:-${NEUROGATE_MODEL:-gpt-5.5}}
      MOTIVATION_IMAGE_MODEL: ${MOTIVATION_IMAGE_MODEL:-${NEUROGATE_IMAGE_MODEL:-gpt-image-2}}
      # Стадия видео (fal.ai). Без FAL_KEY MotivationVideoWorkerService выходит
      # из onModuleInit, не заведя таймер, — заказы копятся в `queued`, и
      # разобрать их некому. Переменную мало задать в Dokploy: compose
      # пробрасывает в контейнер только то, что перечислено здесь.
      #
      # У остальных значений есть дефолты в коде, и читаются они через `||`,
      # поэтому незаданная переменная (пустая строка) их не перебивает.
      FAL_KEY: ${FAL_KEY:-}
      MOTIVATION_IMAGE_MODEL_FALLBACK: ${MOTIVATION_IMAGE_MODEL_FALLBACK:-}
      MOTIVATION_VIDEO_MODEL: ${MOTIVATION_VIDEO_MODEL:-}
      MOTIVATION_VIDEO_DURATION: ${MOTIVATION_VIDEO_DURATION:-}
      MOTIVATION_VIDEO_AUDIO: ${MOTIVATION_VIDEO_AUDIO:-}
      MOTIVATION_VOICE_MODEL: ${MOTIVATION_VOICE_MODEL:-}
      MOTIVATION_VOICE_NAME: ${MOTIVATION_VOICE_NAME:-}
      MOTIVATION_MUSIC_MODEL: ${MOTIVATION_MUSIC_MODEL:-}
      ASTRO_AI_BASE_URL: ${ASTRO_AI_BASE_URL:-${MOTIVATION_AI_BASE_URL:-${NEUROGATE_BASE_URL:-https://r-api.vibemod.pro/v1}}}
      ASTRO_AI_API_KEY: ${ASTRO_AI_API_KEY:-${MOTIVATION_AI_API_KEY:-${NEUROGATE_API_KEY}}}
      # Распознавание снимка состава в «Здоровье» (VED-335) и ИИ-ассистент
      # портала. Ключи заданы в Dokploy, но контейнер получает только то, что
      # перечислено здесь, — без этих строк сервисы отвечают «не настроено»
      # (те же грабли, что были с FIREBASE_SERVICE_ACCOUNT, PR #332).
      # Запасные значения — общий ключ портала, как у «Астрологии» выше.
      WELLNESS_AI_BASE_URL: ${WELLNESS_AI_BASE_URL:-${MOTIVATION_AI_BASE_URL:-${NEUROGATE_BASE_URL:-https://r-api.vibemod.pro/v1}}}
      WELLNESS_AI_API_KEY: ${WELLNESS_AI_API_KEY:-${MOTIVATION_AI_API_KEY:-${NEUROGATE_API_KEY}}}
      # Автопроверка присланных карточек ИИ с поиском (VED-384). Пустые —
      # умолчания в коде (`check-budget.ts`); `WELLNESS_AUTO_CHECK=0` выключает.
      WELLNESS_AUTO_CHECK: ${WELLNESS_AUTO_CHECK:-}
      WELLNESS_SEARCH_MODEL: ${WELLNESS_SEARCH_MODEL:-}
      # Модель, читающая снимок состава. Пустое значение — берётся модель
      # «Вдохновения» (MOTIVATION_TEXT_MODEL, gemini-3.6-flash): человек стоит с
      # телефоном и ждёт ответа, решение пользователя 24.09 — важнее скорость.
      # Фоновая проверка в интернете (WELLNESS_SEARCH_MODEL) — на gpt-5.4: там
      # никто не ждёт, а поиск в интернете умеет только она.
      WELLNESS_VISION_MODEL: ${WELLNESS_VISION_MODEL:-}
      WELLNESS_AI_USD_CENTS_PER_MTOK_IN: ${WELLNESS_AI_USD_CENTS_PER_MTOK_IN:-}
      WELLNESS_AI_USD_CENTS_PER_MTOK_OUT: ${WELLNESS_AI_USD_CENTS_PER_MTOK_OUT:-}
      WELLNESS_AI_USD_CENTS_PER_SEARCH: ${WELLNESS_AI_USD_CENTS_PER_SEARCH:-}
      WELLNESS_AI_DAILY_BUDGET_CENTS: ${WELLNESS_AI_DAILY_BUDGET_CENTS:-}
      WELLNESS_AI_DAILY_CHECKS: ${WELLNESS_AI_DAILY_CHECKS:-}
      WELLNESS_AI_USER_DAILY_CHECKS: ${WELLNESS_AI_USER_DAILY_CHECKS:-}
      ASSISTANT_AI_BASE_URL: ${ASSISTANT_AI_BASE_URL:-${MOTIVATION_AI_BASE_URL:-${NEUROGATE_BASE_URL:-https://r-api.vibemod.pro/v1}}}
      ASSISTANT_AI_API_KEY: ${ASSISTANT_AI_API_KEY:-${MOTIVATION_AI_API_KEY:-${NEUROGATE_API_KEY}}}
      ASSISTANT_AI_USD_CENTS_PER_MTOK_IN: ${ASSISTANT_AI_USD_CENTS_PER_MTOK_IN:-}
      ASSISTANT_AI_USD_CENTS_PER_MTOK_OUT: ${ASSISTANT_AI_USD_CENTS_PER_MTOK_OUT:-}
      ASTRO_TEXT_MODEL: ${ASTRO_TEXT_MODEL:-${MOTIVATION_TEXT_MODEL:-gpt-5.4-mini}}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Пуши в приложение VedaMatch через FCM: JSON сервисного аккаунта одной
      # строкой в base64. Без него пуши в приложение молча выключены.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # TURN для звонков в «Общении» (deploy/coturn, docs/chat-calls-plan.md).
      # Без хоста и секрета /chat/calls/ice-servers отдаёт только STUN.
      TURN_HOST: ${TURN_HOST:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
    networks:
      - dokploy-network
    expose:
      - "4000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Имя бота для кнопки «Войти через Telegram» на странице /login
        # (telegram-login-button.tsx). NEXT_PUBLIC_* вшивается в бандл на
        # сборке — как и NEXT_PUBLIC_API_URL, поэтому передаётся build-арг,
        # а не только рантайм-переменная. Дефолт в коде — vedamatch_bot.
        NEXT_PUBLIC_TELEGRAM_BOT: ${NEXT_PUBLIC_TELEGRAM_BOT:-vedamatch_bot}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      # Публичный адрес S3-хранилища портала — по умолчанию тот же
      # S3_PUBLIC_URL, что у api, отдельная переменная нужна только если APK
      # раздаются из другого места. Страница /app и секция загрузки на
      # лендингах читают отсюда mobile/android/ru-site/latest.json (VED-176).
      # Пусто — карточка Android честно показывает «скоро», без падения.
      APP_DOWNLOAD_BASE_URL: ${APP_DOWNLOAD_BASE_URL:-${S3_PUBLIC_URL:-}}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
    expose:
      - "3000"

  # Веб-версия мобильного приложения — ios.vedamatch.com
  # (docs/prds/iphone-app.prd.md). Статика nginx, от API не зависит: ходит в
  # api.vedamatch.com из браузера. Домен в Dokploy: ios.vedamatch.com → 80.
  # Адрес поддомена должен быть в WEB_ORIGIN API — иначе CORS и возврат
  # после входа (resolveReturnOrigin) его не пустят.
  app-web:
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile.web
      args:
        APP_CONTOUR: com
    restart: unless-stopped
    networks:
      - dokploy-network
    expose:
      - "80"

networks:
  dokploy-network:
    external: true

volumes:
  motivation-redis:
