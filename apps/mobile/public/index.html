<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VedaMatch</title>
    <meta name="description" content="Чаты, звонки, люди и общины VedaMatch" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBF9FF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0614" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VedaMatch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Сброс стилей, который рекомендует react-native-web:
         https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* Цвет до первого кадра React — без белой вспышки в тёмной теме.
           Значения — bg0 из src/theme/tokens.ts. */
        background-color: #fbf9ff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0614;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Для работы VedaMatch включите JavaScript.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
