# Раздача веб-версии приложения (Dockerfile.web).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript application/json application/manifest+json text/css image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Бандл и ассеты Expo — с хешем содержимого в имени: навсегда.
  location /_expo/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Service worker и манифест должны обновляться сразу после выкладки.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # Свой блок `types` на уровне server заменил бы весь стандартный список
  # MIME, поэтому тип манифеста — только здесь.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    types {}
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Одностраничное приложение: любой путь — index.html, маршрут решает
  # Expo Router. Сам index.html не кэшируется: в нём адрес свежего бандла.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }
}
