apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.vedamatch.filehash'
version = '1.0.0'

android {
  namespace "com.vedamatch.filehash"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Юнит-тест чистого потокового хешера (`StreamingSha256Test`) — JVM, без
  // устройства: `./gradlew :vedamatch-file-hash:testReleaseUnitTest` в
  // сгенерированном `android/` (README модуля — в шапке `StreamingSha256.kt`).
  testImplementation 'junit:junit:4.13.2'
}
