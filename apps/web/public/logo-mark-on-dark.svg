<!--
  Знак VedaMatch для тёмной подложки.

  Копия геометрии из src/components/icons/vedamatch-mark.tsx, но «M» здесь
  залита фиксированным светлым цветом вместо переменной темы. Так приходится
  делать потому, что файл подключается через тег img в HTML атрибуции
  Leaflet: внешний SVG внутри img это отдельный документ, стили и переменные
  страницы в него не попадают, и currentColor там не от чего брать.

  Единственное его место — плашка атрибуции карты. Она тёмная в обеих темах
  портала (см. .leaflet-control-attribution в globals.css), поэтому вариант
  под светлый фон не нужен: он был бы файлом, который никто не подключает.

  ВНИМАНИЕ: это XML, и внутри комментария нельзя писать два минуса подряд.
  Имя CSS-переменной с её дефисами роняет разбор всего документа, а браузер
  показывает не ошибку, а битую картинку в 12 пикселей, которую легко
  не заметить. Поэтому переменная здесь названа словами. Разбор проверяется
  тестом vedamatch-mark.spec.tsx, он же сверяет контуры с компонентом.

  width и height проставлены, в отличие от компонента: там размер задаёт
  className, а отдельному файлу нужен свой, иначе тег img без явных размеров
  схлопнется в ноль.
-->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VedaMatch">
  <circle cx="32" cy="13" r="10.5" fill="url(#vm-file-ocean)" />
  <path
    d="M25.5 7.5c2.4-.6 4 .8 5.6.3 1.5-.5 2.4-2 4-1.6 1.3.3 1.6 1.7.8 2.6-1 1.1-3 .9-3.6 2.2-.5 1.2.8 2.2.3 3.4-.6 1.4-3 1.2-3.8 2.5-.7 1.2.3 2.7-.5 3.7-.8 1-2.5.6-3.4-.3-1.6-1.6-2.2-4.2-1.8-6.4.3-2 1-4.3 2.4-6.4Z"
    fill="url(#vm-file-land)"
  />
  <path
    d="M38.5 12.6c1.3-.3 2.6.4 3.3 1.5.7 1.1.6 2.7-.3 3.6-.8.8-2.2.9-3 .2-1-.9-1.2-2.6-.6-3.8.2-.5.4-1 .6-1.5Z"
    fill="url(#vm-file-land)"
  />
  <path
    d="M32 2.5c3.2 3 5 6.6 5 10.5s-1.8 7.5-5 10.5"
    stroke="#BFDBFE"
    stroke-opacity="0.55"
    stroke-width="1.1"
    fill="none"
  />
  <circle cx="32" cy="13" r="10.5" stroke="url(#vm-file-rim)" stroke-width="1.4" fill="none" />

  <path
    d="M5 57 L22 28 L32 45 L42 28 L59 57"
    stroke="#F6F1FF"
    stroke-width="6"
    stroke-linejoin="miter"
    stroke-linecap="butt"
    fill="none"
  />
  <path
    d="M22.5 32.5 L32 49 L41.5 32.5"
    stroke="#F6F1FF"
    stroke-width="4.5"
    stroke-linejoin="miter"
    stroke-linecap="butt"
    fill="none"
    opacity="0.55"
  />

  <defs>
    <linearGradient id="vm-file-ocean" x1="22" y1="3" x2="42" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="1" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="vm-file-land" x1="24" y1="6" x2="40" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ADE80" />
      <stop offset="1" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="vm-file-rim" x1="22" y1="3" x2="42" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD" stop-opacity="0.9" />
      <stop offset="1" stop-color="#1E40AF" stop-opacity="0.5" />
    </linearGradient>
  </defs>
</svg>
