# coturn для звонков VedaMatch. Секрет, realm, внешний IP и TLS-порт
# приходят аргументами из docker-compose.yml — здесь только то, что не
# зависит от сервера.

listening-port=3478
# Один адрес хоста, а не все интерфейсы: без этого coturn слушает и на
# docker-мостах, а relay-кандидаты приходят с адресами 172.x.
listening-ip=192.168.195.2
relay-ip=192.168.195.2
# UDP-диапазон релея. Узкий намеренно: каждый звонок через релей берёт по
# порту на сторону, 240 портов — это ~120 одновременных релейных звонков,
# и открыть их в фаерволе можно одной строкой.
min-port=49160
max-port=49400

# Учётки — короткоживущие HMAC от API (turn-credentials.ts), а не список
# пользователей.
use-auth-secret
fingerprint

cert=/certs/fullchain.pem
pkey=/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# TURN не должен становиться прокси во внутреннюю сеть сервера и Docker.
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Ограничения на один аллокейшн: аудио 50 кбит/с, видео до 2 Мбит/с;
# 3 Мбит/с — потолок с запасом, чтобы чужой трафик через нашу учётку
# не съел канал.
max-bps=3000000
total-quota=200
user-quota=4
stale-nonce=600

no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
log-file=stdout
simple-log
