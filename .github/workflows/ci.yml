name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # shared и Prisma-клиент нужны и tsc, и тестам api/web/importer.
      - name: Build shared + Prisma client
        run: |
          pnpm --filter @vedamatch/shared build
          pnpm --filter @vedamatch/api prisma:generate

      - name: Typecheck api (with specs)
        run: pnpm --filter @vedamatch/api exec tsc --noEmit -p tsconfig.json

      - name: Typecheck web
        run: pnpm --filter @vedamatch/web exec tsc --noEmit

      - name: Typecheck importer
        run: pnpm --filter @vedamatch/vedabase-importer build

      # В api-скрипте lint стоит --fix; в CI линтим без записи.
      # Ошибок сейчас много (см. docs/review-2026-08-19.md) — пока не блокируем,
      # но выводим отчёт. Снять continue-on-error, когда долг разобран.
      - name: Lint api (report only)
        continue-on-error: true
        run: pnpm --filter @vedamatch/api exec eslint "src/**/*.ts" --no-fix

      # 6 ошибок react-hooks (service-grid, theme-provider, member-counter) —
      # долг из отчёта ревью; после исправления убрать continue-on-error.
      - name: Lint web (report only)
        continue-on-error: true
        run: pnpm --filter @vedamatch/web lint

      - name: Test api
        run: pnpm --filter @vedamatch/api test

      - name: Test web
        run: pnpm --filter @vedamatch/web test

      - name: Test importer
        run: pnpm --filter @vedamatch/vedabase-importer test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://api.example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Деплой просит сам CI, а не вебхук Dokploy.
  #
  # 9 сентября вебхук молча перестал приходить: сборки не падали, их просто
  # не было, и полтора дня работы лежали в main при старом коде на проде.
  # Отсюда правило — о деплое должен свидетельствовать тот же прогон, что и о
  # тестах: не пришёл — прогон красный, а не пустой.
  #
  # Заодно деплой теперь идёт ПОСЛЕ тестов и сборки образов, чего вебхук не
  # умел: он срабатывал на пуш и катил что угодно.
  deploy:
    name: deploy prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ask Dokploy to deploy
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            {
              echo "### Деплой пропущен"
              echo
              echo "Секрет \`DOKPLOY_DEPLOY_WEBHOOK\` не задан."
              echo "Пока его нет, после вливания надо жать «Deploy» в панели руками."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Панель берёт ветку из тела запроса в формате GitHub (`ref`), и
          # только при заголовке X-GitHub-Event. Голый POST она отбивала
          # ответом 301 «Branch Not Match» — так 11 сентября прошёл первый же
          # прогон с секретом. Пересылаем ей само событие push этого прогона:
          # в нём и ветка, и изменённые файлы для watch paths, и коммит.
          code=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' -X POST --max-time 60 \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            --data-binary @"$GITHUB_EVENT_PATH" \
            "$HOOK")
          echo "Ответ панели: $code"
          head -c 500 /tmp/deploy.out || true
          # Отказ обязан быть виден: ровно этого не хватало вебхуку.
          case "$code" in
            2*) ;;
            *) echo "::error::Dokploy не принял запрос на деплой ($code)"; exit 1 ;;
          esac

      - name: Wait for prod to answer
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          HEALTH: ${{ vars.PROD_HEALTH_URL || 'https://api.vedamatch.ru/health' }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then exit 0; fi
          # Ждём не здоровья, а своего коммита. «ok» отвечает и старый
          # контейнер: 11 сентября (прогон 34569492771, PR #235) этот шаг
          # прошёл через 3 с после ответа панели, пока новая сборка ещё шла, —
          # упади она, прогон остался бы зелёным. Коммит образа отдаёт
          # /health (apps/api/src/modules/health/build-commit.ts), а узнаёт
          # его сборка из клона панели (apps/api/scripts/build-commit.sh).
          #
          # Срок — по часам, а не числом попыток: запрос к зависшему проду
          # сам длится до 10 с, и «40 попыток по 15 с» растягивались бы.
          short=${EXPECTED:0:7}
          deadline=$(( $(date +%s) + 600 ))
          body=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -s --max-time 10 "$HEALTH" || true)
            # Пока контейнер перезапускается, вместо JSON приходит страница
            # прокси или пустота — это «ещё не готов», а не ошибка.
            commit=$(printf '%s' "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)
            if [ "$commit" = "$EXPECTED" ] && [ "$status" = "ok" ]; then
              echo "На проде $short, здоровье ok: $body"
              echo "На проде коммит \`$short\`, здоровье \`ok\`." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  на проде коммит ${commit:-не указан}, status=${status:-нет ответа}; жду $short"
            sleep 15
          done
          # Коммит мог не совпасть и потому, что панель собрала более свежий
          # main: она клонирует ветку, а не коммит из события. Тогда этот
          # прогон должен был отменить следующий пуш (concurrency выше).
          echo "::error::За 10 минут на проде не появился коммит $short. Последний ответ /health: ${body:-пусто}. Смотрите деплой в панели Dokploy: сборка могла упасть, застрять в очереди или собрать другой коммит."
          {
            echo "### Деплой не подтверждён"
            echo
            echo "Ждали коммит \`$EXPECTED\` на $HEALTH 10 минут."
            echo "Последний ответ: \`${body:-пусто}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
